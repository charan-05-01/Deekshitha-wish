<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday! 🎂</title>
    <style>
        :root {
            --primary-color: #ff6b81;
            --secondary-color: #ff4757;
            --bg-gradient: linear-gradient(135deg, #ffeef8 0%, #e8f0fe 100%);
            --card-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .wrapper {
            text-align: center;
            z-index: 10;
            padding: 20px;
        }

        /* --- Gift Box Animations & Styling --- */
        .gift-container {
            transition: all 0.5s ease;
        }

        .prompt-text {
            color: #4a4a4a;
            margin-bottom: 30px;
            font-size: 1.5rem;
            animation: pulse 2s infinite;
        }

        .gift-box {
            position: relative;
            width: 150px;
            height: 150px;
            margin: 0 auto;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .gift-box:hover {
            transform: scale(1.05);
        }

        .gift-body {
            width: 100%;
            height: 120px;
            background-color: var(--primary-color);
            position: absolute;
            bottom: 0;
            border-radius: 0 0 8px 8px;
        }

        .gift-lid {
            width: 160px;
            height: 40px;
            background-color: var(--secondary-color);
            position: absolute;
            top: 0;
            left: -5px;
            z-index: 2;
            border-radius: 4px;
            transition: transform 0.5s ease;
        }

        .gift-ribbon {
            width: 25px;
            height: 100%;
            background-color: #ffde43;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1;
        }

        /* State when gift is opened */
        .gift-container.opened .gift-lid {
            transform: translateY(-60px) rotate(-15deg);
            opacity: 0;
        }

        .gift-container.opened {
            transform: scale(0);
            opacity: 0;
            height: 0;
            pointer-events: none;
        }

        /* --- Birthday Card Design --- */
        .card {
            background: var(--card-bg);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(255, 107, 129, 0.2);
            max-width: 450px;
            width: 100%;
            transform: scale(0.7);
            opacity: 0;
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .card.show {
            transform: scale(1);
            opacity: 1;
        }

        .card.hide {
            display: none;
        }

        .cake {
            font-size: 4rem;
            margin-bottom: 15px;
            animation: bounce 2s infinite;
        }

        .title {
            color: #2d3436;
            font-size: 2.2rem;
            margin-bottom: 15px;
        }

        .name {
            color: var(--secondary-color);
        }

        .message {
            color: #636e72;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .btn {
            background-color: var(--secondary-color);
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 1.1rem;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 71, 87, 0.4);
            transition: background 0.3s, transform 0.2s;
        }

        .btn:hover {
            background-color: #ff2a3b;
            transform: translateY(-2px);
        }

        /* --- Confetti Elements --- */
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            opacity: 0.85;
            animation: fall linear forwards;
        }

        /* --- Keyframe Animations --- */
        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.03);
            }

            100% {
                transform: scale(1);
            }
        }

        @keyframes bounce {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        @keyframes fall {
            0% {
                transform: translateY(-50px) rotate(0deg);
                opacity: 1;
            }

            100% {
                transform: translateY(105vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <!-- Background Confetti Container -->
    <div id="confetti-wrapper"></div>

    <div class="wrapper">
        <!-- STEP 1: The Interactive Gift Box -->
        <div class="gift-container" id="giftContainer">
            <h2 class="prompt-text">You have a special delivery! Click to open 🎁</h2>
            <div class="gift-box" onclick="openGift()">
                <div class="gift-lid"></div>
                <div class="gift-ribbon"></div>
                <div class="gift-body"></div>
            </div>
        </div>

        <!-- STEP 2: The Hidden Birthday Introduction Card -->
        <div class="card hide" id="birthdayCard">
            <div class="cake">🎂</div>
            <h1 class="title">Happy Birthday, <span class="name">Bestie!</span> ✨</h1>
            <p class="message">
                Welcome to your personal corner of the internet today! Wishing you a fantastic year ahead filled with
                joy, success, and endless adventures. Let the celebrations begin!
            </p>
            <button class="btn" onclick="triggerMoreConfetti()">🎉 Make a Wish!</button>
        </div>
    </div>

    <script>
        // Function handle opening the gift box
        function openGift() {
            const giftContainer = document.getElementById('giftContainer');
            const birthdayCard = document.getElementById('birthdayCard');

            // Trigger gift box opening animations
            giftContainer.classList.add('opened');

            // Transition smoothly to showing the introduction card
            setTimeout(() => {
                giftContainer.style.display = 'none';
                birthdayCard.classList.remove('hide');

                // Slight timeout to let CSS display layout catch up before animating scale
                setTimeout(() => {
                    birthdayCard.classList.add('show');
                    triggerMoreConfetti(); // First blast of confetti!
                }, 50);
            }, 550);
        }

        // Function to generate the programmatic CSS confetti cascade
        function triggerMoreConfetti() {
            const wrapper = document.getElementById('confetti-wrapper');
            const colors = ['#ff6b81', '#ff4757', '#74b9ff', '#55efc4', '#ffeaa7', '#a29bfe'];

            // Generate 50 confetti particles per execution
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti');

                // Randomize positioning, colors, size and animation duration
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.transform = `scale(${Math.random() * 1 + 0.5})`;

                const duration = Math.random() * 2 + 2; // 2s to 4s
                confetti.style.animationDuration = duration + 's';

                wrapper.appendChild(confetti);

                // Clean up DOM elements after animation completes
                setTimeout(() => {
                    confetti.remove();
                }, duration * 1000);
            }
        }
    </script>
</body>

</html>
